<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter Widget Demo — Stop Before It Starts</title>
  <link rel="stylesheet" href="widget.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #555; margin-bottom: 16px; }
    .demo-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin: 24px 0; }
    .demo-btn {
      padding: 10px 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }
    .demo-btn--high { border-color: #b71c1c; color: #b71c1c; }
    .demo-btn--medium { border-color: #e65100; color: #e65100; }
    .demo-btn--low { border-color: #1b5e20; color: #1b5e20; }
    .event-log {
      background: #1a1a1a;
      color: #4caf50;
      padding: 16px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .event-log:empty::after { content: 'Waiting for events...'; color: #666; }
  </style>
</head>
<body>
  <h1>Starter Widget Demo</h1>
  <p>
    Click a button to fire a trigger event at different severity levels.
    The starter widget will respond with an interstitial (high/medium)
    or log only (low).
  </p>

  <div class="demo-buttons">
    <button class="demo-btn demo-btn--high" data-severity="high">🔴 High severity</button>
    <button class="demo-btn demo-btn--medium" data-severity="medium">🟠 Medium severity</button>
    <button class="demo-btn demo-btn--low" data-severity="low">🟢 Low severity</button>
  </div>

  <h2>Event log</h2>
  <div class="event-log" id="event-log"></div>

  <script type="module" src="widget.js"></script>
  <script type="module">
    const log = document.getElementById('event-log');

    function addLog(type, data) {
      const time = new Date().toLocaleTimeString();
      log.textContent += `[${time}] ${type}: ${JSON.stringify(data, null, 2)}\n\n`;
      log.scrollTop = log.scrollHeight;
    }

    // Fire trigger on button click
    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const severity = btn.dataset.severity;
        const detail = {
          type: 'search',
          severity,
          country: 'NL',
          language: navigator.language.split('-')[0] || 'en',
          platformType: 'demo',
          timestamp: new Date().toISOString(),
          sessionScopedId: crypto.randomUUID(),
        };
        addLog('TRIGGER', detail);
        document.body.dispatchEvent(new CustomEvent('sbis:trigger', { detail }));
      });
    });

    // Log results
    document.body.addEventListener('sbis:result', (e) => {
      addLog('RESULT', e.detail);
    });
  </script>
</body>
</html>
